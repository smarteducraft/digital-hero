          h += `<tr><td><button type="button" class="admin-name-link" data-admin-student-index="${idx}" style="border:0;background:none;padding:0;cursor:pointer;color:var(--primary-color);font:inherit;font-weight:bold;text-decoration:underline;">${escapeHtml(u.name)}</button></td><td>${Number(u.rank)}위</td><td style="font-weight:bold;color:#f59e0b;">Lv.${Number(u.overallLevel || 0)}</td><td>${Number(u.badgeCount || 0)}/24개</td><td style="white-space:normal;min-width:250px;">${escapeHtml(levelSummary)}</td><td>${Number(u.posts)}개</td><td style="color:var(--primary-color);font-weight:bold;">${Number(u.points)}P</td></tr>`;
        });
        cont.innerHTML = h + `</table>`;
        cont.querySelectorAll('[data-admin-student-index]').forEach(el => {
          el.addEventListener('click', () => { const u = currentAdminStats[Number(el.dataset.adminStudentIndex)]; if (u) openAdminStudentModal(u.name); });
        });
      } else if(mode === 'badges') {
        btns[1].style.background = 'var(--primary-color)'; btns[1].style.color = 'white';
        let h = `<table><tr><th onclick="handleSort('name')">학생 이름 ${getSortIcon('name')}</th><th>획득한 뱃지 수</th><th>학생 획득 뱃지 현황</th></tr>`;
        arr.forEach((u) => {
          let badgesHTML = Array.from(u.badgeSet).map(topic => {
            const imageUrl = badgeImages[topic];
            const safeTitle = escapeAttr(topic);
            if(imageUrl) {
              const fileId = imageUrl.includes('id=') ? imageUrl.split('id=')[1].split('&')[0] : (imageUrl.includes('/d/') ? imageUrl.split('/d/')[1].split('/')[0] : '');
              return fileId ? `<img src="https://drive.google.com/thumbnail?id=${escapeAttr(fileId)}&sz=w100" title="${safeTitle}" style="width:35px; height:35px; border-radius:50%; border:2px solid #f59e0b; margin:2px;">` : '';
            }
            return `<span style="display:inline-block; width:35px; height:35px; border-radius:50%; background:#f59e0b; color:white; text-align:center; line-height:35px; font-size:0.7em; margin:2px;" title="${safeTitle}">뱃지</span>`;
          }).join('');
          h += `<tr><td>${escapeHtml(u.name)}</td><td style="font-weight:bold;">${Number(u.badgeSet.size)}개</td><td style="display:flex; flex-wrap:wrap; gap:5px; align-items:center;">${badgesHTML || '<span style="color:#94a3b8;">획득한 뱃지가 없습니다.</span>'}</td></tr>`;
        });
        cont.innerHTML = h + `</table>`;
      } else if(mode === 'posts') {
        btns[2].style.background = 'var(--primary-color)'; btns[2].style.color = 'white';
        let postsArr = [...allPostsData];
        if(adminSortState.column) postsArr.sort((a, b) => { let vA = a[adminSortState.column]; let vB = b[adminSortState.column]; return vA < vB ? (adminSortState.order === 'asc' ? -1 : 1) : (vA > vB ? (adminSortState.order === 'asc' ? 1 : -1) : 0); });
        currentAdminPosts = postsArr;
        let h = `<table><tr><th onclick="handleSort('name')">학생 이름 ${getSortIcon('name')}</th><th onclick="handleSort('category')">영역 및 주제 ${getSortIcon('category')}</th><th>게시글 내용 및 사진</th><th onclick="handleSort('points')">포인트 ${getSortIcon('points')}</th><th>관리</th></tr>`;
        postsArr.forEach((post, idx) => {
          const hbText = post.teacherHeart ? '하트완료' : '교사하트(+20)';
          const hbBg = post.teacherHeart ? '#94a3b8' : '#10b981';
          const photoUrl = safeDriveUrl(post.photoUrl);
          const pUrlMini = photoUrl ? `<br><img class="js-admin-photo" data-admin-post-index="${idx}" src="${escapeAttr(photoUrl)}" loading="lazy" alt="${escapeAttr(post.topic)} 활동 사진" style="max-width:100%; border-radius:8px; margin-top:10px; cursor:pointer;">` : '';
          h += `<tr><td style="white-space:nowrap;">${escapeHtml(post.name)}</td><td style="min-width:150px;">${escapeHtml(post.category)}<br><b>${escapeHtml(post.topic)}</b></td><td style="min-width:300px;white-space:normal;word-break:break-all;">${safeTextWithBreaks(post.content)}${pUrlMini}</td><td style="white-space:nowrap;">${Math.max(0, Number(post.points || 0))} P</td><td style="white-space:nowrap;width:120px;"><div style="display:flex;flex-direction:column;gap:5px;"><button type="button" class="admin-btn js-admin-heart" data-admin-post-index="${idx}" style="width:100%;background:${hbBg};">${hbText}</button><button type="button" class="admin-btn delete js-admin-delete" data-admin-post-index="${idx}" style="width:100%;">강제삭제</button></div></td></tr>`;
        });
        cont.innerHTML = h + `</table>`;
        cont.querySelectorAll('.js-admin-heart').forEach(btn => btn.addEventListener('click', () => { const post = currentAdminPosts[Number(btn.dataset.adminPostIndex)]; if (post) toggleAdminHeart(post.postId, btn); }));
        cont.querySelectorAll('.js-admin-delete').forEach(btn => btn.addEventListener('click', () => { const post = currentAdminPosts[Number(btn.dataset.adminPostIndex)]; if (post) adminDel(post.postId); }));
        cont.querySelectorAll('.js-admin-photo').forEach(img => img.addEventListener('click', () => {
          const post = currentAdminPosts[Number(img.dataset.adminPostIndex)];
          const url = post ? safeDriveUrl(post.originalUrl) : '';
          if (url) { document.getElementById('enlarged-img').src = url; document.getElementById('image-modal').style.display = 'flex'; }
        }));
      } else if(mode === 'ops') {
        btns[3].style.background = 'var(--primary-color)'; btns[3].style.color = 'white';
        renderEmbeddedOperations(cont);
      }
    }

    function formatAdminBytes(bytes) {
      const n = Number(bytes || 0);
      if (!n) return '-';
      if (n < 1024) return n + ' B';
      if (n < 1024 * 1024) return (n / 1024).toFixed(1) + ' KB';
      return (n / (1024 * 1024)).toFixed(1) + ' MB';
    }

    function renderEmbeddedOperations(cont) {
      if (currentRole !== 'admin' || !currentSessionToken) { handleAuthExpired('관리자 로그인이 필요합니다.'); return; }
      cont.innerHTML = '<div style="padding:20px;text-align:center;">운영 정보를 불러오는 중입니다... ⏳</div>';
      google.script.run
        .withSuccessHandler(res => {
          if (!res || !res.success) {
            if (res && res.authRequired) handleAuthExpired(getErrorMessage(res, '관리자 세션이 만료되었습니다.'));
            else renderRetryMessage(cont, getErrorMessage(res, '운영 정보를 불러오지 못했습니다.'), () => renderEmbeddedOperations(cont));
            return;
          }
          buildEmbeddedOperations(cont, res);
        })
        .withFailureHandler(err => renderRetryMessage(cont, getErrorMessage(err, '운영 정보 통신 오류가 발생했습니다.'), () => renderEmbeddedOperations(cont)))
        .getOperationsOverviewAdmin(currentSessionToken);
    }

    function buildEmbeddedOperations(cont, res) {
      cont.innerHTML = '';
      const wrap = document.createElement('div');
      wrap.style.cssText = 'padding:6px 2px 20px;';

      const status = document.createElement('div');
      status.style.cssText = 'background:#eff6ff;border:1px solid #bfdbfe;border-radius:12px;padding:14px;margin-bottom:15px;line-height:1.6;';
      status.textContent = '🔐 비밀번호는 해시 저장 · 사진 공유 정책: ' + String(res.photoSharingMode || '-') + ' · 비밀번호 전환: ' + String(res.passwordMigrationAt || 'setup() 실행 필요');
      wrap.appendChild(status);

      const actions = document.createElement('div');
      actions.style.cssText = 'display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;';
      const backupBtn = document.createElement('button');
      backupBtn.className = 'btn-small'; backupBtn.style.cssText = 'background:#2563eb;color:white;padding:9px 14px;'; backupBtn.textContent = '💾 지금 백업';
      backupBtn.addEventListener('click', () => createEmbeddedBackup(backupBtn));
      const reloadBtn = document.createElement('button');
      reloadBtn.className = 'btn-small'; reloadBtn.style.cssText = 'background:#64748b;color:white;padding:9px 14px;'; reloadBtn.textContent = '🔄 새로고침';
      reloadBtn.addEventListener('click', () => renderEmbeddedOperations(cont));
      const photoBtn = document.createElement('button');
      photoBtn.className = 'btn-small'; photoBtn.style.cssText = 'background:#0f766e;color:white;padding:9px 14px;'; photoBtn.textContent = '🖼️ 기존 사진 공유정책·파일명 적용';
      photoBtn.addEventListener('click', () => applyEmbeddedPhotoPolicy(photoBtn));
      actions.appendChild(backupBtn); actions.appendChild(reloadBtn); actions.appendChild(photoBtn); wrap.appendChild(actions);

      function addHeading(text) { const h=document.createElement('h3'); h.textContent=text; h.style.margin='20px 0 8px'; wrap.appendChild(h); }
      function addTable(headers, rows) {
        const table=document.createElement('table'); const thead=document.createElement('tr');
        headers.forEach(h=>{const th=document.createElement('th');th.textContent=h;thead.appendChild(th);}); table.appendChild(thead);
        rows.forEach(cells=>{const tr=document.createElement('tr');cells.forEach(cell=>{const td=document.createElement('td'); if(cell instanceof Node) td.appendChild(cell); else td.textContent=String(cell==null?'':cell); tr.appendChild(td);});table.appendChild(tr);}); wrap.appendChild(table);
      }

      addHeading('백업 목록');
      const backupRows = (res.backups || []).map(item => {
        const btn=document.createElement('button'); btn.type='button'; btn.className='admin-btn delete'; btn.textContent='이 백업으로 복구';
        btn.addEventListener('click',()=>restoreEmbeddedBackup(item.id,item.name,btn));
        return [item.createdAt, item.name, formatAdminBytes(item.size), btn];
      });
      if (backupRows.length) addTable(['백업 시각','파일명','크기','복구'], backupRows); else { const p=document.createElement('p');p.textContent='생성된 백업이 없습니다.';wrap.appendChild(p); }

      addHeading('최근 운영 로그');
      const logRows=(res.logs||[]).slice(0,50).map(x=>[x.time,x.actor,x.action,x.target||x.postId,x.detail,x.success]);
      if(logRows.length) addTable(['시각','작업자','작업','대상','상세','결과'],logRows); else { const p=document.createElement('p');p.textContent='운영 로그가 없습니다.';wrap.appendChild(p); }

      addHeading('최근 게시물 변경 이력');
      const histRows=(res.history||[]).slice(0,50).map(x=>[x.time,x.action,x.actor,x.author,x.topic,String(x.content||'').substring(0,60)]);
      if(histRows.length) addTable(['시각','작업','작업자','작성자','주제','내용 일부'],histRows); else { const p=document.createElement('p');p.textContent='변경 이력이 없습니다.';wrap.appendChild(p); }

      cont.appendChild(wrap);
    }

    function createEmbeddedBackup(button) {
      if (button) button.disabled = true;
      google.script.run
        .withSuccessHandler(res => { if(button) button.disabled=false; if(res&&res.success){alert('백업을 생성했습니다.');renderAdminTable('ops');} else if(res&&res.authRequired)handleAuthExpired(getErrorMessage(res,'관리자 세션이 만료되었습니다.')); else showOperationError(res,'백업 생성에 실패했습니다.'); })
        .withFailureHandler(err => { if(button) button.disabled=false; showOperationError(err,'백업 생성 중 통신 오류가 발생했습니다.'); })
        .createBackupAdmin(currentSessionToken);
    }


    function applyEmbeddedPhotoPolicy(button) {
      if (!confirm('현재 PHOTO_SHARING_MODE 정책을 기존 게시물 사진에도 적용합니다.\nPRIVATE 설정이면 일반 게시판에서 사진이 보이지 않을 수 있습니다.\n계속하시겠습니까?')) return;
      if(button) button.disabled=true;
      google.script.run
        .withSuccessHandler(res => { if(button) button.disabled=false; if(res&&res.success){alert('사진 공유정책 적용 완료: 성공 ' + Number(res.processed||0) + '개, 실패 ' + Number(res.failed||0) + '개');renderAdminTable('ops');} else if(res&&res.authRequired)handleAuthExpired(getErrorMessage(res,'관리자 세션이 만료되었습니다.')); else showOperationError(res,'사진 공유정책 적용에 실패했습니다.'); })
        .withFailureHandler(err => { if(button) button.disabled=false; showOperationError(err,'사진 공유정책 적용 중 통신 오류가 발생했습니다.'); })
        .applyPhotoPolicyToExistingPhotosAdmin(currentSessionToken);
    }

    function restoreEmbeddedBackup(backupId, backupName, button) {
      if (!confirm('선택한 백업으로 게시물과 계정 데이터를 복구합니다.\n복구 직전 현재 상태는 자동 백업됩니다.\n\n' + String(backupName || '') + '\n\n계속하시겠습니까?')) return;
      if(button) button.disabled=true;
      google.script.run
        .withSuccessHandler(res => { if(button) button.disabled=false; if(res&&res.success){if(res.session)applySession(res.session);alert('복구가 완료되었습니다. 기존 로그인 세션은 보안을 위해 초기화되었습니다.');openAdminDashboard();} else if(res&&res.authRequired)handleAuthExpired(getErrorMessage(res,'관리자 세션이 만료되었습니다.')); else showOperationError(res,'백업 복구에 실패했습니다.'); })
        .withFailureHandler(err => { if(button) button.disabled=false; showOperationError(err,'백업 복구 중 통신 오류가 발생했습니다.'); })
        .restoreBackupAdmin(String(backupId || ''), currentSessionToken);
    }

    function openAdminStudentModal(studentName) {
      document.getElementById('admin-student-name-title').innerText = studentName + " 학생의 게시물 기록";
      let cont = document.getElementById('admin-student-posts-container'); cont.innerHTML = '';
      let posts = allPostsData.filter(p => p.name === studentName);
      if(posts.length === 0) cont.innerHTML = "<p style='grid-column: 1/-1; text-align:center;'>작성된 게시물이 없습니다.</p>";
      else posts.forEach(item => cont.appendChild(createPostCard(item, true)));
      document.getElementById('admin-student-modal').style.display = 'flex';
    }

    function adminDel(postId) {
      if(!confirm('관리자 권한으로 삭제합니까?')) return;
      if (currentRole !== 'admin' || !currentSessionToken) { handleAuthExpired('관리자 로그인이 필요합니다.'); return; }
      google.script.run
        .withSuccessHandler(res => {
          if (res && res.success) openAdminDashboard();
          else if (res && res.authRequired) handleAuthExpired(getErrorMessage(res, '관리자 세션이 만료되었습니다.'));
          else showOperationError(res, '삭제에 실패했습니다.');
        })
        .withFailureHandler(err => showOperationError(err, '삭제 처리 중 통신 오류가 발생했습니다.'))
        .deletePostAdmin(postId, currentSessionToken);
    }

    function updateTopics() {
      const cat = document.getElementById('s-category').value; const tSel = document.getElementById('s-topic');
      tSel.innerHTML = '<option value="">주제를 선택하세요</option>';
      if(categories[cat]) categories[cat].topics.forEach(t => { tSel.innerHTML += `<option value="${t}">${t}</option>`; });
    }

    function handleEditClick(postId, name, cat, topic, cont) {
      currentEditData = { postId: postId, name: name, category:cat, topic: topic, content: cont };
      if (currentRole === 'admin') {
        openEditModal();
      } else {
        document.getElementById('check-pw-input').value = '';
        document.getElementById('pw-check-modal').style.display = 'flex';
      }
    }

    function verifyPostPasswordBtn() {
      const pw = document.getElementById('check-pw-input').value; if (!pw) { alert("비밀번호 입력!"); return; }
      google.script.run
        .withSuccessHandler(res => {
          if (res) { currentEditData.password = pw; document.getElementById('pw-check-modal').style.display = 'none'; openEditModal(); }
          else { alert('게시물 비밀번호가 일치하지 않습니다.'); }
        })
        .withFailureHandler(err => showOperationError(err, '게시물 비밀번호 확인 중 오류가 발생했습니다.'))
        .verifyPassword(currentEditData.postId, pw, currentSessionToken);
    }

    function openModal(mode) {
      document.getElementById('main-modal').style.display = 'flex'; document.getElementById('edit-post-id').value = ''; document.getElementById('s-name').value = currentUser;
      document.getElementById('s-category').value = ''; updateTopics(); document.getElementById('s-content').value = ''; document.getElementById('s-password').value = ''; document.getElementById('s-photo').value = '';
      document.getElementById('modal-title').innerText = "활동 기록"; document.getElementById('submit-btn').innerText = "등록하기";
      document.getElementById('new-post-pw-group').style.display = 'block'; document.getElementById('edit-post-pw-group').style.display = 'none'; document.getElementById('delete-btn').style.display = 'none';
      resetSubmitBtn();
    }
    
    function openEditModal() {
      document.getElementById('main-modal').style.display = 'flex'; document.getElementById('edit-post-id').value = currentEditData.postId; document.getElementById('s-name').value = currentEditData.name;
      document.getElementById('s-category').value = currentEditData.category; updateTopics(); document.getElementById('s-topic').value = currentEditData.topic;
      document.getElementById('s-content').value = String(currentEditData.content || ''); document.getElementById('s-new-password').value = ''; document.getElementById('s-photo').value = '';
      document.getElementById('modal-title').innerText = "수정/삭제"; document.getElementById('submit-btn').innerText = "수정완료";
      document.getElementById('new-post-pw-group').style.display = 'none'; document.getElementById('edit-post-pw-group').style.display = 'block'; document.getElementById('delete-btn').style.display = 'block'; document.getElementById('delete-btn').disabled = false;
      resetSubmitBtn();
    }
    
    function closeModal() { if (saveRequestInFlight) return; document.getElementById('main-modal').style.display = 'none'; flushDeferredAutoRefresh(); }

    function deleteDataBtn() {
      if (saveRequestInFlight) return;
      if(!confirm('정말로 삭제할까요?')) return;
      if (!currentSessionToken) { handleAuthExpired('다시 로그인해주세요.'); return; }
      const deleteBtn = document.getElementById('delete-btn');
      deleteBtn.disabled = true;
      google.script.run
        .withSuccessHandler(res => {
          if(res && res.success) {
            deferredAutoRefresh = false;
            closeModal();
            loadBoardPage(false, currentPage);
            if (currentRole === 'student') loadUserDashboardData(true);
          } else {
            if (res && res.authRequired) handleAuthExpired(getErrorMessage(res, '로그인 세션이 만료되었습니다.'));
            else showOperationError(res, '삭제에 실패했습니다.');
            deleteBtn.disabled = false;
          }
        })
        .withFailureHandler(err => {
          showOperationError(err, '삭제 처리 중 통신 오류가 발생했습니다.');
          deleteBtn.disabled = false;
        })
        .deleteData({ postId: currentEditData.postId, password: currentEditData.password || '', sessionToken: currentSessionToken });
    }

    function submitData() {
      if (saveRequestInFlight) return;
      const postId = document.getElementById('edit-post-id').value;
      const name = document.getElementById('s-name').value;
      const cat = document.getElementById('s-category').value;
      const topic = document.getElementById('s-topic').value;
      const content = document.getElementById('s-content').value.trim();
      if (!cat || !topic || !content) { alert('빈칸을 채워주세요!'); return; }
      if (!postId && !document.getElementById('s-password').value) { alert('게시물 비밀번호를 입력해주세요!'); return; }
      if (!currentSessionToken) { handleAuthExpired('로그인 세션이 필요합니다.'); return; }

      saveRequestInFlight = true;
      const submitBtn = document.getElementById('submit-btn');
      const loadingMsg = document.getElementById('loading-msg');
      const deleteBtn = document.getElementById('delete-btn');
      submitBtn.disabled = true;
      if (deleteBtn) deleteBtn.disabled = true;
      if (loadingMsg) loadingMsg.style.display = 'block';
      const file = document.getElementById('s-photo').files[0];

      const fileFailure = (message) => {
        showOperationError(message, '이미지를 처리하지 못했습니다.');
        resetSubmitBtn();
      };

      if (file) {
        const reader = new FileReader();
        reader.onerror = () => fileFailure('선택한 이미지 파일을 읽지 못했습니다.');
        reader.onload = function(e) {
          const img = new Image();
          img.onerror = () => fileFailure('이미지 형식을 읽지 못했습니다. 다른 이미지를 선택해주세요.');
          img.onload = function() {
            try {
              const canvas = document.createElement('canvas');
              const MAX_WIDTH = 800;
              const MAX_HEIGHT = 800;
              let width = img.width; let height = img.height;
              if (width > height) { if (width > MAX_WIDTH) { height *= MAX_WIDTH / width; width = MAX_WIDTH; } }
              else { if (height > MAX_HEIGHT) { width *= MAX_HEIGHT / height; height = MAX_HEIGHT; } }
              canvas.width = Math.max(1, Math.round(width));
              canvas.height = Math.max(1, Math.round(height));
              const ctx = canvas.getContext('2d');
              if (!ctx) throw new Error('이미지 처리 기능을 사용할 수 없습니다.');
              ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
              handleDataSend(postId, name, cat, topic, content, canvas.toDataURL('image/jpeg', 0.6));
            } catch (err) { fileFailure(err); }
          };
          img.src = e.target.result;
        };
        reader.readAsDataURL(file);
      } else {
        handleDataSend(postId, name, cat, topic, content, '');
      }
    }

    function handleDataSend(postId, name, cat, topic, content, photoBase64) {
      if (!saveRequestInFlight) return;
      if (!currentSessionToken) { handleAuthExpired('로그인 세션이 필요합니다.'); resetSubmitBtn(); return; }

      const runner = google.script.run
        .withSuccessHandler(res => {
          if (res && res.success) {
            deferredAutoRefresh = false;
            resetSubmitBtn();
            closeModal();
            loadBoardPage(true, currentPage);
            if (currentRole === 'student') loadUserDashboardData(true);
          } else {
            if (res && res.authRequired) handleAuthExpired(getErrorMessage(res, '로그인 세션이 만료되었습니다.'));
            else showOperationError(res, '저장하지 못했습니다.');
            resetSubmitBtn();
          }
        })
        .withFailureHandler(err => {
          showOperationError(err, '저장 처리 중 통신 오류가 발생했습니다.');
          resetSubmitBtn();
        });

      if (postId) runner.editData({ postId: postId, category: cat, topic: topic, content: content, password: currentEditData.password || '', newPassword: document.getElementById('s-new-password').value, photoBase64: photoBase64, sessionToken: currentSessionToken });
      else runner.saveData({ category: cat, topic: topic, content: content, password: document.getElementById('s-password').value, photoBase64: photoBase64, sessionToken: currentSessionToken });
    }

    function resetSubmitBtn() {
      saveRequestInFlight = false;
      const submitBtn = document.getElementById('submit-btn');
      const loadingMsg = document.getElementById('loading-msg');
      const deleteBtn = document.getElementById('delete-btn');
      if (submitBtn) submitBtn.disabled = false;
      if (loadingMsg) loadingMsg.style.display = 'none';
      if (deleteBtn && document.getElementById('edit-post-id').value) deleteBtn.disabled = false;
      flushDeferredAutoRefresh();
    }

  </script>
</body>
