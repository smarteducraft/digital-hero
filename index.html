<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <title>디지털 히어로를 꿈꾸는 Happy Together</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script>
    // 같은 탭에서 인트로를 한 번 통과했다면 새로고침 방식과 관계없이
    // 본문 스크립트 실행 전부터 인트로를 숨겨 F5 시 깜빡임/재진입을 막습니다.
    // sessionStorage는 새 탭에서는 비어 있으므로 새 탭 최초 접속에는 인트로가 정상 표시됩니다.
    (function() {
      try {
        var introPassed = sessionStorage.getItem('digitalHeroIntroPassedV1') === 'true';
        if (introPassed) {
          document.documentElement.classList.add('skip-intro-on-reload');
        }
      } catch (e) {}
    })();
  </script>
  <style>
    @import url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_two@1.0/NanumSquareRound.woff');
    @font-face {
        font-family: 'NanumSquareRound';
        src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_two@1.0/NanumSquareRound.woff') format('woff');
        font-weight: normal;
        font-style: normal;
    }
    @font-face {
      font-family: 'CookieRun';
      src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2001@1.1/CookieRun-Regular.woff') format('woff');
      font-weight: 400;
      font-style: normal;
    }

    :root { --bg-light: #f0f7ff; --primary-color: #4facfe; --text-dark: #1e293b; --card-bg: #ffffff; }
    
    body { margin: 0; padding: 0; font-family: 'NanumSquareRound', sans-serif; background-color: var(--bg-light); color: var(--text-dark); overflow-x: hidden; }
    
    header { display: flex; justify-content: space-between; align-items: center; padding: 20px 30px; background: #ffffff; border-bottom: 4px solid var(--primary-color); box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
    
    h1 { margin: 0; color: #1e3a8a; font-size: 2.2em; cursor: pointer; user-select: none; flex-grow: 1; text-align: center; text-shadow: 2px 2px 4px rgba(0,0,0,0.08); font-family: 'CookieRun', sans-serif; } 
    h1 i { color: #ff9f1c; margin-right: 8px; }
    h1 span { display: inline-block; transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275), color 0.2s; }
    h1 span:hover { transform: translateY(-8px) scale(1.08); color: var(--primary-color); }
    
    .top-right-controls { min-width: 150px; text-align: right; display: flex; align-items: center; justify-content: flex-end; gap: 10px;}
    
    #top-login-btn { padding: 10px 20px; font-size: 1.1em; font-family: inherit; font-weight: bold; background-color: var(--primary-color); color: white; border: none; border-radius: 12px; cursor: pointer; box-shadow: 0 4px 6px rgba(0,0,0,0.1); transition: all 0.2s; }
    #top-login-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 12px rgba(0,0,0,0.15); background-color: #3b82f6;}
    
    .admin-access-icon { color: #94a3b8; font-size: 1.5em; cursor: pointer; transition: 0.2s; background: none; border: none; padding: 5px; display: none; }
    .admin-access-icon:hover { color: #ef4444; transform: scale(1.1); }
    
    #user-info-box { display: none; background: #ffffff; border: 2px solid #e2e8f0; padding: 8px 20px; border-radius: 50px; align-items: center; justify-content: flex-end; gap: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
    .hero-level-pill { display:none; align-items:center; gap:5px; padding:6px 12px; border-radius:20px; background:#fff7ed; border:2px solid #f59e0b; color:#b45309; font-weight:bold; white-space:nowrap; box-shadow:0 2px 5px rgba(245,158,11,0.12); }
    .hero-level-pill i { color:#f59e0b; }
    .btn-small { padding: 6px 15px; border-radius: 20px; border: none; font-family: inherit; cursor: pointer; font-size: 1em; transition: 0.2s; display: flex; align-items: center; justify-content: center;}
    .btn-small:hover { transform: translateY(-2px); }
    .icon-btn { border-radius: 50%; width: 38px; height: 38px; padding: 0; font-size: 1.1em; }
    
    #student-dashboard { display: none; padding: 20px; max-width: 1200px; margin: 0 auto; }
    .dashboard-panel { background: white; border-radius: 20px; padding: 25px; box-shadow: 0 5px 15px rgba(0,0,0,0.05); margin-bottom: 30px;}
    .dashboard-panel h2 { color: var(--primary-color); text-align: center; margin-top: 0; border-bottom: 2px dashed #cbd5e1; padding-bottom: 10px;}
    
    .badge-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; margin-top: 20px;}
    .badge-category-box { background: #f8fafc; border: 2px solid #e2e8f0; border-radius: 15px; padding: 15px 5px; text-align: center;}
    .badge-category-box h3 { display: block; margin: 0 0 15px 0; color: #334155; font-size: 0.9em; word-break: keep-all; line-height: 1.4; }
    .badge-progress { display: flex; justify-content: center; gap: 8px; flex-wrap: nowrap; overflow-x: auto; padding-bottom: 5px;}

    .growth-overall-summary { display:flex; align-items:center; justify-content:center; gap:18px; flex-wrap:wrap; margin:5px auto 22px; padding:15px 18px; border-radius:18px; background:linear-gradient(135deg,#eff6ff,#fff7ed); border:2px solid #dbeafe; max-width:780px; }
    .growth-overall-level { min-width:92px; text-align:center; font-size:1.45em; font-weight:bold; color:#1d4ed8; }
    .growth-overall-level strong { display:block; font-size:1.55em; color:#f59e0b; line-height:1.1; }
    .growth-overall-detail { min-width:240px; flex:1; max-width:520px; }
    .growth-overall-text { display:flex; justify-content:space-between; gap:10px; margin-bottom:7px; color:#475569; font-weight:bold; }
    .growth-progress-track { width:100%; height:13px; border-radius:999px; background:#e2e8f0; overflow:hidden; }
    .growth-progress-fill { height:100%; width:0%; border-radius:999px; background:linear-gradient(90deg,#4facfe,#f59e0b); transition:width .35s ease; }

    .growth-character-stage { display:flex; align-items:center; gap:12px; margin:0 auto 13px; padding:10px; border-radius:14px; background:#ffffff; border:1px solid #e2e8f0; min-height:150px; }
    .growth-character-visual { width:112px; height:142px; flex:0 0 112px; display:flex; align-items:center; justify-content:center; border-radius:14px; overflow:hidden; background:linear-gradient(145deg,#e0f2fe,#f8fafc); border:2px solid #dbeafe; }
    .growth-character-visual img { width:100%; height:100%; object-fit:contain; display:block; }
    .growth-character-placeholder { text-align:center; color:#64748b; font-weight:bold; font-size:.9em; line-height:1.35; padding:8px; }
    .growth-character-placeholder i { display:block; font-size:2.2em; margin-bottom:7px; color:#94a3b8; }
    .growth-character-info { flex:1; min-width:0; text-align:left; }
    .growth-level-label { display:inline-block; padding:4px 10px; border-radius:999px; background:#eff6ff; color:#2563eb; font-weight:bold; margin-bottom:7px; }
    .growth-character-name { font-size:1em; font-weight:bold; color:#334155; line-height:1.35; word-break:keep-all; }
    .growth-badge-count { margin-top:7px; color:#f59e0b; font-weight:bold; }
    .growth-next-message { margin-top:6px; font-size:.82em; color:#64748b; line-height:1.4; }
    .growth-mini-track { height:9px; margin-top:8px; background:#e2e8f0; border-radius:999px; overflow:hidden; }
    .growth-mini-fill { height:100%; background:var(--primary-color); border-radius:999px; transition:width .35s ease; }

    .badge-item { width: 55px; height: 55px; border-radius: 50%; background: #cbd5e1; display: flex; align-items: center; justify-content: center; color: white; font-size: 1.2em; border: 3px solid #e2e8f0; position: relative; cursor: help; overflow: hidden; flex-shrink: 0; }
    .badge-item.acquired { border-color: #f59e0b; box-shadow: 0 0 10px rgba(251, 191, 36, 0.5); cursor: pointer; transition: transform 0.15s ease, box-shadow 0.15s ease; }
    .badge-item.acquired:hover { transform: scale(1.08); box-shadow: 0 0 14px rgba(251, 191, 36, 0.65); }
    .badge-item:hover::after { content: attr(data-tooltip); position: absolute; bottom: 110%; background: rgba(0,0,0,0.8); color: white; padding: 5px 10px; border-radius: 5px; font-size: 0.7em; white-space: nowrap; z-index: 10; pointer-events: none;}

    @media (max-width: 768px) {
      .badge-grid { grid-template-columns: 1fr; }
      .growth-character-stage { align-items:center; }
      .growth-character-visual { width:100px; height:128px; flex-basis:100px; }
      .growth-overall-summary { align-items:stretch; }
      .growth-overall-level { width:100%; }
    }

    #board-section { max-width: 95%; margin: 0 auto; padding: 0 20px;}
    #badge-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 30px; padding: 20px; padding-bottom: 130px; }
    .badge-card { background: var(--card-bg); border: 3px solid #e2e8f0; border-top: 5px solid var(--primary-color); border-radius: 20px; padding: 25px; width: 100%; box-sizing: border-box; box-shadow: 0 8px 20px rgba(0, 0, 0, 0.08); position: relative; display: flex; flex-direction: column;}
    
    .badge-icon { position: absolute; top: -25px; right: 20px; background: #ffffff; color: var(--primary-color); width: 50px; height: 50px; border-radius: 50%; text-align: center; line-height: 50px; font-size: 24px; border: 3px solid var(--primary-color); }
    .teacher-badge { position: absolute; top: -25px; left: 20px; background: #ff4757; color: white; padding: 5px 15px; border-radius: 20px; font-size: 0.9em; border: 2px solid white; box-shadow: 0 2px 5px rgba(0,0,0,0.2); animation: bounce 1s infinite;}
    @keyframes bounce { 0%, 100% {transform: translateY(0);} 50% {transform: translateY(-5px);} }
    .badge-photo { width: 100%; height: auto; max-height: 250px; object-fit: contain; border-radius: 12px; margin-top: 15px; margin-bottom: 15px; border: 1px solid #e2e8f0; cursor: pointer; }
    .badge-name { font-size: 1.2em; color: #ff9f1c; margin-bottom: 10px; display: flex; align-items: center; justify-content: space-between; }
    .badge-category { font-size: 0.9em; color: #64748b; margin-bottom: 5px; background: #e2e8f0; padding: 3px 8px; border-radius: 8px; display: inline-block; align-self: flex-start;}
    .badge-title { font-size: 1.1em; color: #0284c7; margin-bottom: 15px; font-weight: bold;}
    .badge-content { font-size: 1em; line-height: 1.6; background: #f8fafc; padding: 12px; border-radius: 12px; max-height: 150px; overflow-y: auto; border: 1px solid #e2e8f0; color: var(--text-dark); margin-bottom: 15px; flex-grow: 1;}
    .interaction-area { display: flex; justify-content: space-between; align-items: center; border-top: 1px dashed #cbd5e1; padding-top: 15px; }
    
    .heart-btn { background: none; border: none; font-size: 1.2em; color: #ff4757; cursor: pointer; font-family: inherit; transition: 0.2s;}
    .heart-btn:hover { transform: scale(1.2); }
    .heart-btn.liked i { font-weight: 900; } 
    .heart-btn i { font-weight: 400; } 
    
    .points-display { font-size: 1.1em; color: var(--primary-color); font-weight: bold; }
    .edit-btn { color: #94a3b8; cursor: pointer; font-size: 0.9em;} .edit-btn:hover { color: #4facfe; }

    #add-btn { position: fixed; bottom: 40px; right: 40px; width: 70px; height: 70px; border-radius: 50%; background: #ff9f1c; color: #ffffff; font-size: 35px; border: none; cursor: pointer; z-index: 1000; box-shadow: 0 5px 15px rgba(255,159,28,0.4); display: block;}
    #add-btn:hover { transform: scale(1.1) rotate(90deg); transition: 0.3s;}
    
    #admin-dashboard { display: none; padding: 20px; max-width: 1200px; margin: 0 auto; }
    .admin-controls { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;}
    
    .table-container { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; background: white; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); white-space: pre-wrap; table-layout: auto;}
    th, td { padding: 15px; text-align: left; border-bottom: 1px solid #e2e8f0; } 
    th { background: var(--primary-color); color: white; font-weight: normal; cursor: pointer; position: sticky; top: 0;}
    th i { margin-left: 5px; font-size: 0.8em;}
    th:hover { background: #3b82f6;}
    .admin-btn { padding: 6px 12px; background: #10b981; color: white; border: none; border-radius: 8px; cursor: pointer; font-family: inherit; width: 100%;}
    .admin-btn.delete { background: #ef4444; }

    .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 2000; justify-content: center; align-items: center; }
    .modal-content { background: #ffffff; border: 4px solid var(--primary-color); border-radius: 20px; padding: 30px; width: 90%; max-width: 500px; max-height: 90vh; overflow-y: auto;}
    .input-group { margin-bottom: 15px; } .input-group label { display: block; margin-bottom: 5px; color: #0284c7; }
    .input-group input, .input-group select, .input-group textarea { width: 100%; padding: 12px; border-radius: 12px; border: 2px solid #cbd5e1; font-family: inherit; font-size: 1.1em; box-sizing: border-box; }
    .input-group textarea { height: 120px; resize: none; }
    .btn-group { display: flex; justify-content: space-between; margin-top: 20px; gap: 8px; }
    .btn { padding: 15px; border: none; border-radius: 12px; font-size: 1.1em; cursor: pointer; flex: 1; font-family: inherit; transition: 0.2s;}
    .btn-submit { background: var(--primary-color); color: #fff; } .btn-submit:disabled { background: #cbd5e1; cursor: not-allowed; }
    .btn-cancel { background: #e2e8f0; color: #475569; }
    .btn-danger { background: #ef4444; color: #fff; display: none; } 
    
    .mini-modal .modal-content { max-width: 350px; text-align: center; }
    
    #image-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 3000; justify-content: center; align-items: center; flex-direction: column; }
    #image-modal img { max-width: 90%; max-height: 85%; border-radius: 15px; }
    .close-img-btn { color: white; font-size: 2em; margin-top: 20px; cursor: pointer; background: none; border: none; font-family: inherit; }

    #post-detail-modal .modal-content { max-width: 600px; padding: 40px; position: relative;}
    .close-detail-btn { position: absolute; top: 15px; right: 20px; background: none; border: none; font-size: 1.5em; cursor: pointer; color: #64748b;}
    #detail-photo { width: 100%; max-height: 300px; object-fit: contain; border-radius: 12px; margin-bottom: 15px; display: none;}
    
    #intro-screen { 
      display: flex; 
      position: fixed; 
      top: 0; 
      left: 0; 
      width: 100%; 
      height: 100%; 
      background-color: var(--bg-light); 
      z-index: 9999; 
      flex-direction: column; 
      justify-content: center; 
      align-items: center; 
      cursor: default; 
      transition: opacity 0.3s ease;
    }
    html.skip-intro-on-reload #intro-screen { display: none !important; }
    #intro-screen img { max-width: 90vw; max-height: 75vh; object-fit: contain; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); margin-bottom: 25px; cursor: pointer; }
    .intro-btn { padding: 15px 50px; font-size: 1.5em; font-family: inherit; font-weight: bold; background-color: #ff9f1c; color: white; border: none; border-radius: 40px; cursor: pointer; box-shadow: 0 5px 15px rgba(255,159,28,0.4); transition: transform 0.2s, background-color 0.2s; z-index: 10001; }
    .intro-btn:hover { transform: scale(1.05); background-color: #f59e0b; }

    #pagination-container {
      display: none;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      margin: -95px auto 120px auto;
      padding: 0 20px;
    }
    .page-btn {
      min-width: 42px;
      height: 42px;
      padding: 0 12px;
      border: 2px solid #cbd5e1;
      border-radius: 12px;
      background: white;
      color: #475569;
      font-family: inherit;
      font-size: 1em;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s;
    }
    .page-btn:hover:not(:disabled) {
      transform: translateY(-2px);
      border-color: var(--primary-color);
      color: var(--primary-color);
    }
    .page-btn.active {
      background: var(--primary-color);
      border-color: var(--primary-color);
      color: white;
    }
    .page-btn:disabled { opacity: 0.4; cursor: default; }
    #pagination-info { width: 100%; text-align: center; color: #64748b; font-size: 0.95em; margin-top: 4px; }
  </style>
</head>
<body>

  <div id="intro-screen">
    <img id="intro-image" src="https://drive.google.com/thumbnail?id=1sBiAAU3RKtjx-8bKfrrahqUbDEXJD29l&sz=w1000" alt="디지털 히어로 인트로">
    <button type="button" id="intro-enter-btn" class="intro-btn">들어가기</button>
  </div>

  <header>
    <div style="min-width: 150px;">
      <button id="refresh-btn" class="btn-small" style="background:#f8fafc; color:#4facfe; border: 2px solid #4facfe; font-size:1em; padding:8px 15px; border-radius:12px; font-weight:bold;" onclick="refreshCurrentView()"><i class="fa-solid fa-rotate-right"></i> 수동 새로고침</button>
    </div>
    <h1 id="main-title" onclick="goHome()">
      <i class="fa-solid fa-medal"></i> 
      <span>디지털</span> <span>히어로를</span> <span>꿈꾸는</span> <span>Happy</span> <span>Together</span>
    </h1>
    
    <div class="top-right-controls">
      <button class="admin-access-icon" id="admin-page-btn" onclick="openAdminDashboard()" title="관리자 페이지">
        <i class="fa-solid fa-lock"></i>
      </button>
      
      <button id="top-login-btn" onclick="document.getElementById('login-modal').style.display='flex'">
        <i class="fa-solid fa-arrow-right-to-bracket"></i> 로그인
      </button>
      
      <div id="user-info-box">
        <span style="font-size: 1.1em; color: var(--text-dark); cursor: default;">👦 <b><span id="display-name"></span></b> <span id="display-role" style="font-size: 0.9em; color: #64748b; display:none;">히어로</span></span>
        <span id="hero-level-box" class="hero-level-pill" title="디지털 뱃지 0/24개 획득"><i class="fa-solid fa-star"></i> Lv.<span id="display-level">0</span></span>
        <span style="color:#f59e0b; font-weight:bold; font-size: 1.1em; cursor: default; margin-right: 5px;"><i class="fa-solid fa-trophy"></i> <span id="display-points">0</span>P</span>
        <button class="btn-small" style="background:#f0f7ff; color:var(--primary-color); border: 2px solid var(--primary-color); font-weight: bold;" onclick="showMyBadges()">뱃지</button>
        <button class="btn-small" style="background:#f0f7ff; color:var(--primary-color); border: 2px solid var(--primary-color); font-weight: bold;" onclick="showMyPosts()">게시글</button>
        <button class="btn-small icon-btn" style="background:#f59e0b; color:white;" onclick="openChangePwModal('student')" title="비밀번호"><i class="fa-solid fa-key"></i></button>
        <button class="btn-small icon-btn" style="background:var(--primary-color); color:white;" onclick="goHome()" title="Home"><i class="fa-solid fa-house"></i></button>
        <button class="btn-small icon-btn" style="background:#e2e8f0; color:#475569;" onclick="logout()" title="로그아웃"><i class="fa-solid fa-power-off"></i></button>
      </div>
    </div>
  </header>
  
  <div id="loading" style="text-align: center; color: var(--primary-color); font-size: 1.5em; margin-top: 50px;">기록을 불러오는 중입니다...⏳</div>
  
  <div id="student-dashboard">
    <div class="dashboard-panel">
      <h2 id="badge-dashboard-title">✨ 나의 디지털 히어로 성장 현황 ✨</h2>
      <div id="growth-overall-summary" class="growth-overall-summary">
        <div class="growth-overall-level">전체 히어로 레벨<strong>Lv.<span id="dashboard-overall-level">0</span></strong></div>
        <div class="growth-overall-detail">
          <div class="growth-overall-text"><span>획득한 디지털 뱃지</span><span><b id="dashboard-total-badges">0</b>/24개</span></div>
          <div class="growth-progress-track"><div id="dashboard-overall-progress" class="growth-progress-fill"></div></div>
        </div>
      </div>
      <div class="badge-grid" id="badge-grid-container"></div>
    </div>
  </div>

  <div id="board-section">
    <h3 id="board-title" style="text-align:center; color:#64748b; margin-top:10px; display:none;">내 게시물 목록</h3>
    
    <div id="board-search-bar" style="display:flex; gap:10px; justify-content:center; margin-bottom:20px; flex-wrap:wrap; background:white; padding:15px; border-radius:15px; box-shadow:0 4px 6px rgba(0,0,0,0.05);">
      <input type="text" id="filter-name" placeholder="학생 이름 검색" onkeyup="scheduleBoardReload()" style="padding:10px; border-radius:10px; border:2px solid var(--primary-color); font-family:inherit; font-size:1em;">
      <select id="filter-category" onchange="updateFilterTopics(); loadBoardPage(false, 1);" style="padding:10px; border-radius:10px; border:2px solid var(--primary-color); font-family:inherit; font-size:1em;">
        <option value="">모든 영역</option>
      </select>
      <select id="filter-topic" onchange="loadBoardPage(false, 1)" style="padding:10px; border-radius:10px; border:2px solid var(--primary-color); font-family:inherit; font-size:1em;">
        <option value="">모든 주제</option>
      </select>
      <button class="btn-small" onclick="resetFilters()" style="background:#64748b; color:white; font-size:1em; padding:10px 15px;"><i class="fa-solid fa-rotate-right"></i> 초기화</button>
    </div>

    <div id="badge-container"></div>

    function escapeHtml(value) {
      return String(value == null ? '' : value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function escapeAttr(value) {
      return escapeHtml(value).replace(/`/g, '&#96;');
    }

    function safeTextWithBreaks(value) {
      return escapeHtml(value).replace(/\r?\n/g, '<br>');
    }

    function safeDriveUrl(value) {
      const raw = String(value || '').trim();
      if (!raw) return '';
      try {
        const u = new URL(raw, window.location.href);
        if (u.protocol !== 'https:') return '';
        if (u.hostname !== 'drive.google.com') return '';
        return u.href;
      } catch (e) {
        return '';
      }
    }

    function getErrorMessage(err, fallback) {
      if (err && typeof err.error === 'string' && err.error.trim()) return err.error.trim();
      if (err && typeof err.message === 'string' && err.message.trim()) return err.message.trim();
      if (typeof err === 'string' && err.trim()) return err.trim();
      return fallback || '처리 중 오류가 발생했습니다.';
    }

    function showOperationError(err, fallback) {
      let message = getErrorMessage(err, fallback);

      container.innerHTML = '';
      const box = document.createElement('div');
      box.style.textAlign = 'center';
      box.style.padding = '20px';
      box.style.color = '#ef4444';
      const title = document.createElement('div');
      title.textContent = '⚠️ ' + String(message || '데이터를 불러오지 못했습니다.');
      box.appendChild(title);
      if (typeof retryFn === 'function') {
        const btn = document.createElement('button');
        btn.className = 'btn-small';
        btn.style.margin = '12px auto 0';
        btn.style.background = '#4facfe';
        btn.style.color = 'white';
        btn.textContent = '다시 시도';
        btn.addEventListener('click', retryFn);
        box.appendChild(btn);
      }
      container.appendChild(box);
    }

    function isAnyModalOpen() {
      return Array.from(document.querySelectorAll('.modal-overlay')).some(el => getComputedStyle(el).display !== 'none') ||
        (document.getElementById('image-modal') && getComputedStyle(document.getElementById('image-modal')).display !== 'none');
    }

    function isTextEntryActive() {
      const el = document.activeElement;
      if (!el) return false;
      return el.tagName === 'INPUT' || el.tagName === 'TEXTAREA' || el.tagName === 'SELECT';
    }

    function shouldDeferAutoRefresh() {
      const adminVisible = document.getElementById('admin-dashboard') && document.getElementById('admin-dashboard').style.display === 'block';
      return document.hidden || saveRequestInFlight || heartRequestsInFlight.size > 0 || activeBoardRequests > 0 || isAnyModalOpen() || isTextEntryActive() || adminVisible;
    }

    function requestAutoRefresh() {
      if (shouldDeferAutoRefresh()) {
        deferredAutoRefresh = true;
        return;
      }
      deferredAutoRefresh = false;
      loadBoardPage(true, currentPage);
    }

    // 현재 요청의 success/failure 처리가 모두 끝난 뒤에만 보류 새로고침을 실행한다.
    // 같은 순간에 여러 이벤트가 발생해도 타이머는 하나만 유지한다.
    function flushDeferredAutoRefresh() {
      if (!deferredAutoRefresh || shouldDeferAutoRefresh()) return;
      if (deferredRefreshTimer) window.clearTimeout(deferredRefreshTimer);

      deferredRefreshTimer = window.setTimeout(() => {
        deferredRefreshTimer = null;
        if (shouldDeferAutoRefresh()) {
          deferredAutoRefresh = true;
          return;
        }
        deferredAutoRefresh = false;
        loadBoardPage(true, currentPage);
      }, 250);
    }

    function isAppsScriptBridgeAvailable() {
      return typeof google !== 'undefined' &&
        google && google.script && google.script.run;
    }

    function showInitialLoadError(message) {
      initialBoardLoadState = 'error';
      const loading = document.getElementById('loading');
      if (!loading) return;
      loading.style.display = 'block';
      renderRetryMessage(
        loading,
        message || '게시판 초기 데이터를 불러오지 못했습니다.',
        () => loadBoardPage(false, 1)
      );
    }

    function showFatalClientError(message) {
      if (hasInitialBoardLoadCompleted) return;
      showInitialLoadError('화면 초기화 중 오류가 발생했습니다. ' + String(message || ''));
    }

    window.addEventListener('error', function(event) {
      if (!hasInitialBoardLoadCompleted) {
        showFatalClientError(event && event.message ? event.message : '알 수 없는 JavaScript 오류');
      }
    });

    window.addEventListener('unhandledrejection', function(event) {
      if (!hasInitialBoardLoadCompleted) {
        const reason = event && event.reason;
        showFatalClientError(reason && reason.message ? reason.message : String(reason || '알 수 없는 비동기 오류'));
      }
    });

    document.addEventListener('visibilitychange', function() {
      if (!document.hidden) flushDeferredAutoRefresh();
    });

    document.addEventListener('focusout', function() {
      window.setTimeout(flushDeferredAutoRefresh, 100);
    });

    function isReloadNavigation() {
      try {
        const entries = performance.getEntriesByType('navigation');
        if (entries && entries.length) return entries[0].type === 'reload';
        return !!(performance.navigation && performance.navigation.type === 1);
      } catch (e) {
        return false;
      }
    }

    function hasPassedIntro() {
      try {
        return sessionStorage.getItem(INTRO_PASSED_KEY) === 'true';
      } catch (e) {
        return false;
      }
    }

    function markIntroPassed() {
      try {
        sessionStorage.setItem(INTRO_PASSED_KEY, 'true');
      } catch (e) {
        console.warn('인트로 상태 저장 실패:', e);
      }
    }

    function readPageState() {
      try {
        const raw = sessionStorage.getItem(PAGE_STATE_KEY);
        return raw ? JSON.parse(raw) : null;
      } catch (e) {
        return null;
      }
    }

    function savePageState() {
      if (!hasPassedIntro()) return;
      try {
        let screen = 'board';
        const studentDash = document.getElementById('student-dashboard');
        const adminDash = document.getElementById('admin-dashboard');
        if (studentDash && getComputedStyle(studentDash).display !== 'none') screen = 'badges';
        else if (adminDash && getComputedStyle(adminDash).display !== 'none') screen = 'admin';

        const filterName = document.getElementById('filter-name');
        const filterCategory = document.getElementById('filter-category');
        const filterTopic = document.getElementById('filter-topic');

        const state = {
          screen: screen,
          viewMode: currentViewMode,
          adminPreviewMode: adminPreviewMode === true,
          page: Math.max(1, Number(currentPage || 1)),
          filterName: filterName ? filterName.value : '',
          filterCategory: filterCategory ? filterCategory.value : '',
          filterTopic: filterTopic ? filterTopic.value : '',
          adminMode: adminSortState.currentMode || 'rank',
          adminSortColumn: adminSortState.column || '',
          adminSortOrder: adminSortState.order || 'asc',
          scrollY: Math.max(0, Number(window.scrollY || 0))
        };
        sessionStorage.setItem(PAGE_STATE_KEY, JSON.stringify(state));
      } catch (e) {
        console.warn('현재 화면 상태 저장 실패:', e);
      }
    }

    function restoreFiltersFromState(state) {
      const nameEl = document.getElementById('filter-name');
      const catEl = document.getElementById('filter-category');
      const topicEl = document.getElementById('filter-topic');
      if (nameEl) nameEl.value = String((state && state.filterName) || '');
      if (catEl) {
        const savedCat = String((state && state.filterCategory) || '');
        catEl.value = categories[savedCat] ? savedCat : '';
      }
      updateFilterTopics();
      if (topicEl) {
        const savedTopic = String((state && state.filterTopic) || '');
        const exists = Array.from(topicEl.options).some(opt => opt.value === savedTopic);
        topicEl.value = exists ? savedTopic : '';
      }
    }

    function scheduleScrollRestore(y) {
      pendingRestoreScrollY = Math.max(0, Number(y || 0));
      window.setTimeout(() => {
        if (pendingRestoreScrollY == null) return;
        const target = pendingRestoreScrollY;
        pendingRestoreScrollY = null;
        window.scrollTo(0, target);
      }, 180);
    }

    function restorePageStateAfterReload(state) {
      state = state || {};

      // F5에서는 화면의 위치/필터/모드만 복원하고,
      // 실제 데이터 갱신은 상단 '수동 새로고침'과 동일한 refreshCurrentView()가 담당합니다.
      restoreFiltersFromState(state);

      adminSortState.column = String(state.adminSortColumn || '');
      adminSortState.order = state.adminSortOrder === 'desc' ? 'desc' : 'asc';
      adminSortState.currentMode = String(state.adminMode || 'rank');

      const screen = String(state.screen || 'board');
      const savedPage = Math.max(1, Number(state.page || 1));
      const restoreScrollY = Math.max(0, Number(state.scrollY || 0));

      if (
        screen === 'admin' &&
        currentRole === 'admin' &&
        currentSessionToken
      ) {
        adminPreviewMode = false;
        document.getElementById('board-section').style.display = 'none';
        document.getElementById('student-dashboard').style.display = 'none';
        document.getElementById('admin-dashboard').style.display = 'block';

        refreshCurrentView({
          restoreScrollY: restoreScrollY
        });
        return;
      }

      if (screen === 'badges' && currentUser) {
        adminPreviewMode = false;
        document.getElementById('admin-dashboard').style.display = 'none';
        document.getElementById('board-section').style.display = 'none';
        document.getElementById('student-dashboard').style.display = 'block';

        const loading = document.getElementById('loading');
        if (loading) loading.style.display = 'none';

        const title = document.getElementById('badge-dashboard-title');

        if (currentRole === 'admin') {
          if (title) title.textContent = '✨ 디지털 히어로 성장캐릭터 전체 보기 ✨';
        } else {
          if (title) title.textContent = '✨ 나의 디지털 히어로 성장 현황 ✨';
        }

        refreshCurrentView({
          restoreScrollY: restoreScrollY
        });
        return;
      }

      // 일반 게시판 / 학생의 내 게시물 / admin 교육용 게시판
      document.getElementById('admin-dashboard').style.display = 'none';
      document.getElementById('student-dashboard').style.display = 'none';
      document.getElementById('board-section').style.display = 'block';

      adminPreviewMode =
        state.adminPreviewMode === true &&
        currentRole === 'admin';

      currentViewMode =
        state.viewMode === 'my' &&
        currentRole === 'student'
          ? 'my'
          : 'all';

      currentPage = savedPage;

      refreshCurrentView({
        restoreScrollY: restoreScrollY
      });
    }

    function queuePageStateSave() {
      if (!hasPassedIntro()) return;
      if (pageStateSaveTimer) window.clearTimeout(pageStateSaveTimer);
      pageStateSaveTimer = window.setTimeout(function() {
        pageStateSaveTimer = null;
        savePageState();
      }, 260);
    }

    window.addEventListener('pagehide', savePageState);
    window.addEventListener('scroll', queuePageStateSave, { passive: true });
    document.addEventListener('change', queuePageStateSave);

    function clearClientSession() {
      currentUser = '';
      currentRole = '';
      currentSessionToken = '';
      currentUserDashboard = null;
      try { localStorage.removeItem(SESSION_STORAGE_KEY); } catch (e) {}
      try {
        sessionStorage.removeItem('currentUser');
        sessionStorage.removeItem('userRole');
      } catch (e) {}
    }

    function applySession(session) {
      if (!session || !session.token || !session.name || !session.role) return false;
      currentUser = session.name;
      currentRole = session.role;
      currentSessionToken = session.token;
      try { localStorage.setItem(SESSION_STORAGE_KEY, JSON.stringify(session)); } catch (e) { console.warn(e); }
      // 구버전 탭 호환을 위해 표시용 값만 유지(권한 판정에는 사용하지 않음)
      sessionStorage.setItem('currentUser', currentUser);
      sessionStorage.setItem('userRole', currentRole);

      document.getElementById('display-name').innerText = currentUser;
      document.getElementById('top-login-btn').style.display = 'none';
      document.getElementById('user-info-box').style.display = 'flex';
      document.getElementById('admin-page-btn').style.display = currentRole === 'admin' ? 'block' : 'none';
      const levelBox = document.getElementById('hero-level-box');
      if (levelBox) levelBox.style.display = currentRole === 'student' ? 'inline-flex' : 'none';
      if (currentRole !== 'student') {
        const levelText = document.getElementById('display-level');
        if (levelText) levelText.textContent = '0';
      }
      return true;
    }

    function restoreLoginSession(onComplete) {
      const done = typeof onComplete === 'function' ? onComplete : function() {};
      let raw = null;
      try { raw = localStorage.getItem(SESSION_STORAGE_KEY); } catch (e) {}
      if (!raw) { done(false); return; }

      let saved;
      try {
        saved = JSON.parse(raw);
      } catch (e) {
        clearClientSession();
        done(false);
        return;
      }
      if (!saved || !saved.token) {
        clearClientSession();
        done(false);
        return;
      }

      google.script.run
        .withSuccessHandler(res => {
          if (res && res.success && res.session) {
            applySession(res.session);
            if (currentRole === 'student') loadUserDashboardData(true);
            done(true);
            return;
          }

          // 서버가 정상 응답으로 세션 무효/만료를 확인한 경우에만 로그아웃합니다.
          handleAuthExpired();
          done(false);
        })
        .withFailureHandler(err => {
          // 중요: 통신 오류를 세션 만료로 오인하지 않습니다.
          // localStorage의 토큰을 유지하고, 마지막으로 저장된 공개 세션 정보로 UI를 복원합니다.
          console.warn('세션 검증 통신 실패 - 저장된 로그인 상태를 유지합니다.', err);

          if (saved && saved.token && saved.name && saved.role) {
            applySession(saved);
            done(true);
          } else {
            done(false);
          }
        })
        .validateSession(saved.token);
    }

    function handleAuthExpired(message) {
      clearClientSession();
      document.getElementById('user-info-box').style.display = 'none';
      document.getElementById('top-login-btn').style.display = 'block';
      document.getElementById('admin-page-btn').style.display = 'none';
      document.getElementById('admin-dashboard').style.display = 'none';
      document.getElementById('student-dashboard').style.display = 'none';
      document.getElementById('board-section').style.display = 'block';
      currentViewMode = 'all';
      if (message) alert(message);
    }

    window.addEventListener('storage', (e) => {
      if (e.key !== SESSION_STORAGE_KEY) return;
      if (!e.newValue) {
        clearClientSession();
        document.getElementById('user-info-box').style.display = 'none';
        document.getElementById('top-login-btn').style.display = 'block';
        document.getElementById('admin-page-btn').style.display = 'none';
        document.getElementById('admin-dashboard').style.display = 'none';
        document.getElementById('board-section').style.display = 'block';
      } else {
        restoreLoginSession();
      }
    });

    document.addEventListener('DOMContentLoaded', function() {
      try {
        const select = document.getElementById('s-category');
        const filterCat = document.getElementById('filter-category');
        for(let cat in categories) {
          select.innerHTML += `<option value="${cat}">${cat}</option>`;
          filterCat.innerHTML += `<option value="${cat}">${cat}</option>`;
        }
        
        let savedRememberedUser = localStorage.getItem('rememberedUsername');
        if (savedRememberedUser) { document.getElementById('login-name').value = savedRememberedUser; }

        initIntro();

        if (isAppsScriptBridgeAvailable()) {
          const shouldRestoreCurrentView = hasPassedIntro() && !!savedReloadState;

          if (shouldRestoreCurrentView) {
            // Apps Script iframe의 reload 판별값과 무관하게,
            // 같은 탭에서 저장된 화면 상태가 있으면 세션 검증 후 현재 화면을 최신 데이터로 복원합니다.
            restoreLoginSession(function() {
              restorePageStateAfterReload(savedReloadState || { screen: 'board', page: 1 });
            });
          } else {
            // 최초 접속 또는 인트로에서 새로고침: 인트로는 그대로 두고
            // 게시판 데이터만 뒤에서 미리 불러옵니다.
            restoreLoginSession();
            loadData(false);
          }

          autoRefresh = setInterval(requestAutoRefresh, 60000);
        } else {
          showInitialLoadError('Apps Script 통신 기능을 찾을 수 없습니다. 웹앱 배포 주소로 다시 접속해주세요.');
        }
      } catch (err) {
        console.error(err);
        showFatalClientError(getErrorMessage(err, '초기 화면을 준비하지 못했습니다.'));
      }
    });

    function initIntro() {
      const intro = document.getElementById('intro-screen');

      // 같은 탭에서 이미 인트로를 통과했다면 새로고침 판별값과 관계없이 건너뜁니다.
      // 새 탭은 sessionStorage가 별도이므로 최초 접속 인트로가 다시 표시됩니다.
      if (hasPassedIntro()) {
        introClosed = true;
        if (intro && intro.parentNode) intro.parentNode.removeChild(intro);
        return;
      }

      const introImage = document.getElementById('intro-image');
      const enterBtn = document.getElementById('intro-enter-btn');
      if (!intro) { showInitialBoard(); return; }

      // 자동 종료 타이머 없음. 빈 배경 클릭으로도 닫히지 않습니다.
      // 오직 인트로 이미지 또는 '들어가기' 버튼을 클릭해야 게시판으로 이동합니다.
      if (introImage) introImage.addEventListener('click', closeIntro);
      if (enterBtn) enterBtn.addEventListener('click', closeIntro);
    }

    function closeIntro(e) {
      if (e) { e.preventDefault(); e.stopPropagation(); }
      if (introClosed) return;
      introClosed = true;
      markIntroPassed();

      const intro = document.getElementById('intro-screen');
      if (!intro) { showInitialBoard(); return; }
      intro.style.pointerEvents = 'none';
      intro.style.opacity = '0';
      window.setTimeout(() => { 
        if (intro && intro.parentNode) intro.parentNode.removeChild(intro); 
        showInitialBoard(); 
      }, 350);
    }

    // 인트로 종료와 데이터 로딩 완료를 분리한다.
    // 서버 응답 전에는 로딩을 유지하고, 성공했을 때만 게시판 렌더링을 확정한다.
    function showInitialBoard() {
      document.getElementById('admin-dashboard').style.display = 'none';
      document.getElementById('student-dashboard').style.display = 'none';
      document.getElementById('board-section').style.display = 'block';
      currentViewMode = 'all';

      const loading = document.getElementById('loading');
      if (initialBoardLoadState === 'success' || hasInitialBoardLoadCompleted) {
        if (loading) loading.style.display = 'none';
        if (typeof renderBoard === 'function') renderBoard();
      } else if (initialBoardLoadState === 'error') {
        if (loading) loading.style.display = 'block';
      } else {
        if (loading) {
          loading.style.display = 'block';
          loading.textContent = '기록을 불러오는 중입니다...⏳';
        }
      }
      savePageState();
      window.scrollTo(0, 0);
    }

    function updateFilterTopics() {
      const cat = document.getElementById('filter-category').value; 
      const tSel = document.getElementById('filter-topic');
      tSel.innerHTML = '<option value="">모든 주제</option>';
      if(categories[cat]) categories[cat].topics.forEach(t => tSel.innerHTML += `<option value="${t}">${t}</option>`);
    }

    function resetFilters() {
      document.getElementById('filter-name').value = '';
      document.getElementById('filter-category').value = '';
      updateFilterTopics();
      currentPage = 1;
      savePageState();
      loadBoardPage(false, 1);
    }

    function handleAddClick() {
      if(!currentUser) document.getElementById('login-modal').style.display = 'flex';
      else openModal('add');
    }

    function goHome() {
      adminPreviewMode = false;
      if (currentRole === 'admin') document.getElementById('admin-dashboard').style.display = 'none';
      document.getElementById('board-section').style.display = 'block';
      document.getElementById('student-dashboard').style.display = 'none';
      currentViewMode = 'all'; currentPage = 1; resetFilters();
    }

    // admin은 수업 설명용으로 전체 24개 뱃지를 미리보기하고,
    // 학생은 본인이 실제로 획득한 뱃지를 기존 방식대로 확인한다.
    function showMyBadges() {
      if(!currentUser) return;

      adminPreviewMode = false;
      document.getElementById('admin-dashboard').style.display = 'none';
      document.getElementById('student-dashboard').style.display = 'block';
      document.getElementById('board-section').style.display = 'none';

      const title = document.getElementById('badge-dashboard-title');

      if (currentRole === 'admin') {
        if (title) title.textContent = '✨ 디지털 히어로 성장캐릭터 전체 보기 ✨';
        renderAdminBadgePreview();
      } else {
        if (title) title.textContent = '✨ 나의 디지털 히어로 성장 현황 ✨';
        if (currentUserDashboard) updateUserDashboard(currentUserDashboard);
        else loadUserDashboardData(false);
      }

      savePageState();
      document.getElementById('student-dashboard').scrollIntoView({behavior: 'smooth'});
    }

    // admin 상단의 '게시글' 버튼은 학생의 '내 게시물' 권한을 사용하지 않는다.
    // 대신 전체 게시판을 교육용 학생 화면처럼 보여준다.
    function showMyPosts() {
      if(!currentUser) return;

      document.getElementById('admin-dashboard').style.display = 'none';
      document.getElementById('student-dashboard').style.display = 'none';
      document.getElementById('board-section').style.display = 'block';

      adminPreviewMode = currentRole === 'admin';
      currentViewMode = currentRole === 'admin' ? 'all' : 'my';
      currentPage = 1;
      resetFilters();
      savePageState();
    }

    function login() {
      const name = document.getElementById('login-name').value.trim();
      const pw = document.getElementById('login-pw').value;
      if(!name || !pw) { alert('이름과 비밀번호를 입력하세요.'); return; }

      const btn = document.getElementById('login-btn-submit');
      btn.innerText = '로딩 중...'; btn.disabled = true;

      google.script.run
        .withSuccessHandler(res => {
          btn.innerText = '접속하기'; btn.disabled = false;
          if(res && res.success && res.session) {
            applySession(res.session);
            localStorage.setItem('rememberedUsername', res.session.name);
            document.getElementById('login-modal').style.display = 'none';
            document.getElementById('login-pw').value = '';

            if(currentRole === 'admin') {
              openAdminDashboard();
            } else {
              loadUserDashboardData(false);
              document.getElementById('student-dashboard').style.display = 'none';
              currentViewMode = 'all';
              loadBoardPage(true, 1);
            }
          } else {
            alert((res && res.error) ? res.error : '로그인 정보가 일치하지 않습니다.');
          }
        })
        .withFailureHandler(err => {
          btn.innerText = '접속하기'; btn.disabled = false;
          alert('로그인 처리 중 오류가 발생했습니다: ' + err.message);
        })
        .loginUser(name, pw);
    }

    function logout() {
      const tokenToClose = currentSessionToken;
      if (tokenToClose && typeof google !== 'undefined') {
        google.script.run.withFailureHandler(function(){}).logoutSession(tokenToClose);
      }
      clearClientSession();
      document.getElementById('user-info-box').style.display = 'none';
      document.getElementById('top-login-btn').style.display = 'block';
      document.getElementById('student-dashboard').style.display = 'none';
      document.getElementById('admin-page-btn').style.display = 'none';
      document.getElementById('admin-dashboard').style.display = 'none';
      document.getElementById('board-section').style.display = 'block';
      document.getElementById('login-pw').value = '';
      currentViewMode = 'all'; currentPage = 1; resetFilters();
    }

    function loadData(isSilent) { loadBoardPage(!!isSilent, currentPage); }

    function refreshCurrentView(options) {
      const opts = options || {};
      const hasRestoreScroll =
        opts.restoreScrollY !== undefined &&
        opts.restoreScrollY !== null;

      const restoreScrollY = hasRestoreScroll
        ? Math.max(0, Number(opts.restoreScrollY || 0))
        : null;

      // 관리자 대시보드:
      // 수동 새로고침과 F5 모두 현재 관리자 탭을 최신 데이터로 다시 불러옵니다.
      if (
        document.getElementById('admin-dashboard').style.display === 'block'
      ) {
        openAdminDashboard(
          adminSortState.currentMode,
          hasRestoreScroll
            ? restoreScrollY
            : (window.scrollY || 0)
        );
        return;
      }

      // 뱃지 화면:
      // 학생은 최신 획득 현황/포인트 재조회,
      // admin 교육용 뱃지는 동일 화면을 다시 렌더링합니다.
      if (
        document.getElementById('student-dashboard').style.display === 'block'
      ) {
        const loading = document.getElementById('loading');
        if (loading) loading.style.display = 'none';

        if (currentRole === 'admin') {
          renderAdminBadgePreview();

          if (hasRestoreScroll) {
            scheduleScrollRestore(restoreScrollY);
          }
        } else if (currentRole === 'student') {
          if (hasRestoreScroll) {
            pendingRestoreScrollY = restoreScrollY;
          }
          loadUserDashboardData(false);
        }
        return;
      }

      // 일반 게시판 / 내 게시물 / admin 교육용 게시판:
      // 현재 페이지와 현재 검색·필터를 그대로 사용해 최신 데이터를 조회합니다.
      if (hasRestoreScroll) {
        pendingRestoreScrollY = restoreScrollY;
      }

      if (currentRole === 'student' && currentSessionToken) {
        loadUserDashboardData(true);
      }
      loadBoardPage(false, currentPage);
    }

    // ===== F5 / Ctrl+R / Cmd+R: 브라우저 전체 재로딩 대신 수동 새로고침과 동일하게 처리 =====
    document.addEventListener('keydown', function(event) {
      const key = String(event.key || '').toLowerCase();
      const isF5 = event.key === 'F5' || event.keyCode === 116;
      const isRefreshShortcut = (event.ctrlKey || event.metaKey) && key === 'r';

      if (!isF5 && !isRefreshShortcut) return;

      // 인트로를 아직 통과하지 않은 최초 화면에서는 기존 브라우저 새로고침을 허용합니다.
      if (!hasPassedIntro()) return;

      event.preventDefault();
      event.stopPropagation();
      if (typeof event.stopImmediatePropagation === 'function') event.stopImmediatePropagation();

      const y = Math.max(0, Number(window.scrollY || 0));
      savePageState();
      refreshCurrentView({ restoreScrollY: y });
    }, true);

    function scheduleBoardReload() {
      if (boardSearchTimer) clearTimeout(boardSearchTimer);
      boardSearchTimer = setTimeout(() => { currentPage = 1; loadBoardPage(true, 1); }, 350);
    }

    function loadBoardPage(isSilent, requestedPage) {
      const page = Math.max(1, parseInt(requestedPage || 1, 10));
      const requestId = ++boardRequestSerial;
      const loading = document.getElementById('loading');
      const isInitialLoadAttempt = !hasInitialBoardLoadCompleted;

      activeBoardRequests += 1;
      if (isInitialLoadAttempt) initialBoardLoadState = 'loading';

      if (!isSilent && loading) {
        loading.style.display = 'block';
        loading.textContent = '기록을 불러오는 중입니다...⏳';
      }

      let settled = false;
      let noticeTimerId = null;

      // 요청 자체를 15초에 강제 실패시키지 않습니다.
      // Apps Script가 잠시 느린 경우에도 정상 응답이 도착하면 그대로 화면에 반영합니다.
      const finalizeRequest = () => {
        if (settled) return false;
        settled = true;
        if (noticeTimerId) {
          window.clearTimeout(noticeTimerId);
          noticeTimerId = null;
        }
        activeBoardRequests = Math.max(0, activeBoardRequests - 1);
        window.setTimeout(flushDeferredAutoRefresh, 0);
        return true;
      };

      const handleFailure = (err) => {
        if (settled) return;
        const isLatest = requestId === boardRequestSerial;
        finalizeRequest();
        if (!isLatest) return;

        const message = getErrorMessage(err, '데이터를 불러오는 중 오류가 발생했습니다.');

        if (isInitialLoadAttempt) initialBoardLoadState = 'error';

        // 자동 새로고침 실패는 기존 게시판을 그대로 유지합니다.
        if (isSilent && hasInitialBoardLoadCompleted) {
          console.warn('게시판 자동 새로고침 실패:', message);
          return;
        }

        if (loading) {
          loading.style.display = 'block';
          renderRetryMessage(loading, message, () => loadBoardPage(false, page));
        }
      };

      // 20초가 지나도 응답이 없을 때는 실패로 판정하지 않고 안내 문구만 바꿉니다.
      noticeTimerId = window.setTimeout(() => {
        if (settled || requestId !== boardRequestSerial) return;
        if (!isSilent && loading) {
          loading.style.display = 'block';
          loading.textContent = '데이터를 불러오는 데 시간이 조금 걸리고 있습니다. 잠시만 기다려주세요... ⏳';
        } else if (isInitialLoadAttempt && loading) {
          loading.style.display = 'block';
          loading.textContent = '데이터를 불러오는 데 시간이 조금 걸리고 있습니다. 잠시만 기다려주세요... ⏳';
        }
      }, BOARD_REQUEST_NOTICE_MS);

      if (!isAppsScriptBridgeAvailable()) {
        handleFailure(new Error('Apps Script 통신 기능을 사용할 수 없습니다.'));
        return;
      }

      const options = {
        page: page,
        pageSize: PAGE_SIZE,
        viewMode: currentViewMode,
        sessionToken: currentSessionToken || '',
        name: document.getElementById('filter-name').value.trim(),
        category: document.getElementById('filter-category').value,
        topic: document.getElementById('filter-topic').value
      };

      try {
        google.script.run
          .withSuccessHandler(res => {
            if (settled) return;
            const isLatest = requestId === boardRequestSerial;

            // 이전 검색/페이지 요청의 늦은 응답은 화면에 덮어쓰지 않습니다.
            if (!isLatest) {
              finalizeRequest();
              return;
            }

            if (!res || !Array.isArray(res.posts)) {
              handleFailure(res);
              return;
            }

            allPostsData = res.posts || [];
            currentFilteredCount = Number(res.totalCount || 0);
            currentPage = Number(res.page || 1);
            totalPages = Math.max(1, Number(res.totalPages || 1));

            if (isInitialLoadAttempt) {
              hasInitialBoardLoadCompleted = true;
              initialBoardLoadState = 'success';
            }

            if (loading) loading.style.display = 'none';
            if (document.getElementById('board-section').style.display !== 'none') {
              renderBoard();
              if (pendingRestoreScrollY != null) {
                scheduleScrollRestore(pendingRestoreScrollY);
              }
            }

            queuePageStateSave();
            finalizeRequest();
          })
          .withFailureHandler(err => {
            handleFailure(err);
          })
          .getBoardPage(options);
      } catch (err) {
        handleFailure(err);
      }
    }

    function calculateGrowthState(acquiredTopics) {
      const acquiredSet = new Set((Array.isArray(acquiredTopics) ? acquiredTopics : []).map(v => String(v || '').trim()).filter(Boolean));
      const categoryGrowth = {};
      let totalBadges = 0;

      Object.keys(categories).forEach(cat => {
        const validTopics = categories[cat].topics || [];
        const acquired = validTopics.filter(topic => acquiredSet.has(topic));
        const count = acquired.length;
        totalBadges += count;
        categoryGrowth[cat] = {
          badgeCount: count,
          level: count,
          maxLevel: validTopics.length,
          acquiredTopics: acquired
        };
      });

      return {
        totalBadges: totalBadges,
        overallLevel: totalBadges,
        maxLevel: 24,
        categories: categoryGrowth
      };
    }

    function normalizeGrowthState(data, acquiredTopics) {
      const fallback = calculateGrowthState(acquiredTopics);
      if (!data || !data.growth || typeof data.growth !== 'object') return fallback;

      const serverGrowth = data.growth;
      const normalized = {
        totalBadges: Math.max(0, Math.min(24, Number(serverGrowth.totalBadges || 0))),
        overallLevel: Math.max(0, Math.min(24, Number(serverGrowth.overallLevel || 0))),
        maxLevel: 24,
        categories: {}
      };

      Object.keys(categories).forEach(cat => {
        const item = serverGrowth.categories && serverGrowth.categories[cat];
        const fb = fallback.categories[cat];
        const badgeCount = item ? Math.max(0, Math.min(4, Number(item.badgeCount || 0))) : fb.badgeCount;
        normalized.categories[cat] = {
          badgeCount: badgeCount,
          level: badgeCount,
          maxLevel: 4,
          acquiredTopics: item && Array.isArray(item.acquiredTopics) ? item.acquiredTopics : fb.acquiredTopics
        };
      });

      // 서버 응답이 구버전/비정상 값이면 공식 24개 주제로 계산한 값을 우선합니다.
      const verifiedTotal = Object.values(normalized.categories).reduce((sum, item) => sum + Number(item.badgeCount || 0), 0);
      normalized.totalBadges = verifiedTotal;
      normalized.overallLevel = verifiedTotal;
      return normalized;
    }

    function getGrowthCharacterInfo(category, level) {
      const levelNum = Math.max(0, Math.min(4, Number(level || 0)));
      if (levelNum === 0) return { name: '성장 준비 중', fileId: '' };
      const catConfig = growthCharacterImages[category] || {};
      return catConfig[levelNum] || { name: 'Lv.' + levelNum + ' 성장 히어로', fileId: '' };
    }

    function makeDriveThumbnailFromId(fileId, size) {
      const id = String(fileId || '').trim();
      if (!id) return '';
      return 'https://drive.google.com/thumbnail?id=' + encodeURIComponent(id) + '&sz=w' + Math.max(200, Number(size || 500));
    }

    function makeDriveGoogleusercontentFromId(fileId, size) {
      const id = String(fileId || '').trim();
      if (!id) return '';
      return 'https://lh3.googleusercontent.com/d/' + encodeURIComponent(id) + '=w' + Math.max(200, Number(size || 500));
    }

    function makeDriveViewFromId(fileId) {
      const id = String(fileId || '').trim();
      if (!id) return '';
      return 'https://drive.google.com/uc?export=view&id=' + encodeURIComponent(id);
    }

    // 성장캐릭터/뱃지처럼 화면에서 즉시 보여야 하는 Drive 이미지는
    // lazy loading을 사용하지 않고, 여러 공개 이미지 주소를 순차적으로 시도합니다.
    // Drive 응답이 오류 없이 오래 대기하는 경우도 있으므로 타임아웃 후 다음 주소로 넘어갑니다.
    const DRIVE_IMAGE_TIMEOUT_MS = 5000;
    const driveImageResolvedUrlCache = new Map();

    function getDriveImageCandidates(fileId, size) {
      const id = String(fileId || '').trim();
      if (!id) return [];

      const width = Math.max(200, Number(size || 500));
      const cacheKey = id + '@' + width;
      const cached = driveImageResolvedUrlCache.get(cacheKey) || '';
      const urls = [
        cached,
        makeDriveThumbnailFromId(id, width),
        makeDriveGoogleusercontentFromId(id, width),
        makeDriveViewFromId(id)
      ].filter(Boolean);

      // 같은 주소가 중복될 경우 한 번만 시도합니다.
      return Array.from(new Set(urls));
    }

    function loadDriveImageStable(img, fileId, size, onFail, onLoad) {
      if (!img) {
        if (typeof onFail === 'function') onFail();
        return;
      }

      const id = String(fileId || '').trim();
      const width = Math.max(200, Number(size || 500));
      const urls = getDriveImageCandidates(id, width);
      const cacheKey = id + '@' + width;

      if (!id || !urls.length) {
        if (typeof onFail === 'function') onFail();
        return;
      }

      let index = 0;
      let finished = false;
      let timerId = null;
      let attemptToken = 0;

      function clearAttemptTimer() {
        if (timerId) {
          window.clearTimeout(timerId);
          timerId = null;
        }
      }

      function finishFailure() {
        if (finished) return;
        finished = true;
        clearAttemptTimer();
        img.onload = null;
        img.onerror = null;
        if (typeof onFail === 'function') onFail();
      }

      function tryNext() {
        if (finished) return;
        clearAttemptTimer();

        if (index >= urls.length) {
          finishFailure();
          return;
        }

        const url = urls[index++];
        const token = ++attemptToken;

        img.onload = function() {
          if (finished || token !== attemptToken) return;
          finished = true;
          clearAttemptTimer();
          driveImageResolvedUrlCache.set(cacheKey, url);
          img.onload = null;
          img.onerror = null;
          if (typeof onLoad === 'function') onLoad(url);
        };

        img.onerror = function() {
          if (finished || token !== attemptToken) return;
          tryNext();
        };

        img.src = url;

        timerId = window.setTimeout(function() {
          if (finished || token !== attemptToken) return;
          tryNext();
        }, DRIVE_IMAGE_TIMEOUT_MS);
      }

      tryNext();
    }

    function applyGrowthCharacterCatalog(catalog) {
      growthCharacterCatalogAttempted = true;
      growthCharacterCatalogStatus = catalog || null;

      if (!catalog || !catalog.categories || typeof catalog.categories !== 'object') {
        if (catalog && catalog.error) console.warn('성장캐릭터 카탈로그:', catalog.error);
        return;
      }

      let appliedCount = 0;
      Object.keys(categories).forEach(category => {
        const serverCategory = catalog.categories[category] || {};
        const localCategory = growthCharacterImages[category] || {};

        for (let level = 1; level <= 4; level++) {
          const item = serverCategory[level] || serverCategory[String(level)];
          if (!item || !String(item.fileId || '').trim()) continue;

          const current = localCategory[level] || { name: 'Lv.' + level + ' 성장 히어로', fileId: '' };
          localCategory[level] = {
            name: String(item.name || current.name || ('Lv.' + level + ' 성장 히어로')).trim(),
            fileId: String(item.fileId || '').trim(),
            fileName: String(item.fileName || '')
          };
          appliedCount += 1;
        }

        growthCharacterImages[category] = localCategory;
      });

      growthCharacterCatalogLoaded = appliedCount > 0;
      if (catalog.success === false && catalog.error) {
        console.warn('성장캐릭터 폴더 자동 연결 실패:', catalog.error);
      } else {
        console.info('성장캐릭터 자동 연결:', appliedCount + '/24개');
      }
    }

    function ensureGrowthCharacterCatalog(onComplete) {
      const done = typeof onComplete === 'function' ? onComplete : function() {};
      if (growthCharacterCatalogAttempted || !currentSessionToken || !isAppsScriptBridgeAvailable()) {
        done();
        return;
      }

      google.script.run
        .withSuccessHandler(function(catalog) {
          applyGrowthCharacterCatalog(catalog);
          done();
        })
        .withFailureHandler(function(err) {
          growthCharacterCatalogAttempted = true;
          console.warn('성장캐릭터 이미지 목록을 불러오지 못했습니다.', err);
          done();
        })
        .getGrowthCharacterCatalogForSession(currentSessionToken);
    }

    function updateGrowthSummary(growth) {
      const total = Math.max(0, Math.min(24, Number(growth && growth.totalBadges || 0)));
      const level = total;
      const pct = Math.round((total / 24) * 100);

      const displayLevel = document.getElementById('display-level');
      if (displayLevel) displayLevel.textContent = String(level);
      const levelBox = document.getElementById('hero-level-box');
      if (levelBox) {
        levelBox.style.display = currentRole === 'student' ? 'inline-flex' : 'none';
        levelBox.title = '디지털 뱃지 ' + total + '/24개 획득';
      }

      const dashLevel = document.getElementById('dashboard-overall-level');
      const dashBadges = document.getElementById('dashboard-total-badges');
      const dashProgress = document.getElementById('dashboard-overall-progress');
      if (dashLevel) dashLevel.textContent = String(level);
      if (dashBadges) dashBadges.textContent = String(total);
      if (dashProgress) dashProgress.style.width = pct + '%';
    }

    function buildGrowthCharacterStage(category, growthState) {
      const level = Math.max(0, Math.min(4, Number(growthState && growthState.level || 0)));
      const badgeCount = Math.max(0, Math.min(4, Number(growthState && growthState.badgeCount || 0)));
      const info = getGrowthCharacterInfo(category, level);
      const stage = document.createElement('div');
      stage.className = 'growth-character-stage';

      const visual = document.createElement('div');
      visual.className = 'growth-character-visual';

      if (level > 0 && String(info.fileId || '').trim()) {
        visual.style.position = 'relative';

        const loadingPlaceholder = document.createElement('div');
        loadingPlaceholder.className = 'growth-character-placeholder';
        loadingPlaceholder.innerHTML = '<i class="fa-solid fa-spinner"></i>이미지 불러오는 중...';
        visual.appendChild(loadingPlaceholder);

        const img = document.createElement('img');
        img.loading = 'eager';
        img.decoding = 'async';
        img.alt = info.name;
        img.style.cssText = 'position:absolute;inset:0;width:100%;height:100%;object-fit:contain;';
        visual.appendChild(img);

        loadDriveImageStable(img, info.fileId, 500, function() {
          visual.innerHTML = '';
          const fallback = document.createElement('div');
          fallback.className = 'growth-character-placeholder';
          fallback.innerHTML = '<i class="fa-solid fa-user-astronaut"></i>Lv.' + level + '<br>이미지를 불러오지 못했습니다.';
          visual.appendChild(fallback);
        }, function() {
          if (loadingPlaceholder.parentNode === visual) visual.removeChild(loadingPlaceholder);
        });
      } else {
        const placeholder = document.createElement('div');
        placeholder.className = 'growth-character-placeholder';
        if (level === 0) {
          placeholder.innerHTML = '<i class="fa-solid fa-lock"></i>첫 뱃지를 모아<br>히어로를 깨워보세요!';
        } else {
          placeholder.innerHTML = '<i class="fa-solid fa-user-astronaut"></i>Lv.' + level + '<br>캐릭터 이미지 등록 대기';
        }
        visual.appendChild(placeholder);
      }

      const infoBox = document.createElement('div');
      infoBox.className = 'growth-character-info';

      const levelLabel = document.createElement('div');
      levelLabel.className = 'growth-level-label';
      levelLabel.textContent = '영역 Lv.' + level + ' / 4';

      const name = document.createElement('div');
      name.className = 'growth-character-name';
      name.textContent = info.name;

      const count = document.createElement('div');
      count.className = 'growth-badge-count';
      count.textContent = '🏅 뱃지 ' + badgeCount + ' / 4';

      const track = document.createElement('div');
      track.className = 'growth-mini-track';
      const fill = document.createElement('div');
      fill.className = 'growth-mini-fill';
      fill.style.width = (badgeCount * 25) + '%';
      track.appendChild(fill);

      const next = document.createElement('div');
      next.className = 'growth-next-message';
      if (badgeCount >= 4) next.textContent = '🎉 이 영역의 최종 성장 단계에 도달했어요!';
      else if (badgeCount === 0) next.textContent = '첫 번째 활동을 완료하면 Lv.1로 성장합니다.';
      else next.textContent = '다음 성장까지 뱃지 ' + (4 - badgeCount >= 1 ? '1개' : '0개') + '가 필요해요.';

      infoBox.appendChild(levelLabel);
      infoBox.appendChild(name);
      infoBox.appendChild(count);
      infoBox.appendChild(track);
      infoBox.appendChild(next);
      stage.appendChild(visual);
      stage.appendChild(infoBox);
      return stage;
    }

    function renderGrowthDashboard(acquiredTopics, postsByTopic, growth, options) {
      const opts = options || {};
      const grid = document.getElementById('badge-grid-container');
      if (!grid) return;

      const myAcquiredTopics = Array.isArray(acquiredTopics) ? acquiredTopics : [];
      const acquiredSet = new Set(myAcquiredTopics);
      const growthState = growth && growth.categories ? growth : calculateGrowthState(myAcquiredTopics);
      window.myPostsMap = postsByTopic || {};
      grid.innerHTML = '';
      updateGrowthSummary(growthState);

      Object.keys(categories).forEach(cat => {
        const box = document.createElement('div');
        box.className = 'badge-category-box';

        const heading = document.createElement('h3');
        const icon = document.createElement('i');
        icon.className = 'fa-solid ' + categories[cat].icon;
        heading.appendChild(icon);
        heading.appendChild(document.createTextNode(' ' + cat));
        box.appendChild(heading);

        const catGrowth = growthState.categories && growthState.categories[cat]
          ? growthState.categories[cat]
          : calculateGrowthState(myAcquiredTopics).categories[cat];
        box.appendChild(buildGrowthCharacterStage(cat, catGrowth));

        const progress = document.createElement('div');
        progress.className = 'badge-progress';

        categories[cat].topics.forEach((topic, idx) => {
          const isAcq = acquiredSet.has(topic);
          const badge = document.createElement('div');
          badge.className = 'badge-item' + (isAcq ? ' acquired' : '');
          badge.dataset.tooltip = topic;
          const imageUrl = badgeImages[topic];

          if (imageUrl) {
            const fileId = imageUrl.includes('id=') ? imageUrl.split('id=')[1].split('&')[0] : (imageUrl.includes('/d/') ? imageUrl.split('/d/')[1].split('/')[0] : '');
            if (fileId) {
              // 이미지 응답이 늦거나 실패해도 빈 원만 남지 않도록 숫자 fallback을 먼저 표시합니다.
              const numberFallback = document.createElement('span');
              numberFallback.textContent = String(idx + 1);
              numberFallback.style.cssText = 'position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:bold;color:white;';
              badge.appendChild(numberFallback);

              const img = document.createElement('img');
              img.loading = 'eager';
              img.decoding = 'async';
              img.alt = topic + ' 뱃지';
              img.style.cssText = 'position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:50%;' + (isAcq ? '' : 'filter:grayscale(100%) opacity(40%);');
              badge.appendChild(img);

              loadDriveImageStable(img, fileId, 200, function() {
                if (img.parentNode === badge) badge.removeChild(img);
              }, function() {
                if (numberFallback.parentNode === badge) badge.removeChild(numberFallback);
              });
            } else {
              badge.textContent = String(idx + 1);
            }
          } else if (isAcq) {
            const acquiredIcon = document.createElement('i');
            acquiredIcon.className = 'fa-solid ' + categories[cat].icon;
            badge.appendChild(acquiredIcon);
          } else {
            badge.textContent = String(idx + 1);
          }

          if (isAcq && opts.allowDetails !== false) {
            badge.addEventListener('click', () => openDetailModal(topic));
          } else if (opts.preview === true) {
            badge.style.cursor = 'help';
          }
          progress.appendChild(badge);
        });

        box.appendChild(progress);
        grid.appendChild(box);
      });
    }

    function renderBoard() {

        renderPagination(); return;
      }
      let renderIndex = 0;
      function renderChunk() {
        const fragment = document.createDocumentFragment();
        const chunkEnd = Math.min(renderIndex + RENDER_CHUNK_SIZE, allPostsData.length);
        for (; renderIndex < chunkEnd; renderIndex++) {
          if (allPostsData[renderIndex].name && allPostsData[renderIndex].topic) fragment.appendChild(createPostCard(allPostsData[renderIndex], false));

    function addHeart(postId, btnElem) {
      if(!currentSessionToken) { alert('로그인 후 하트를 누를 수 있습니다!'); return; }
      if (!postId || heartRequestsInFlight.has(postId)) return;

      const heartType = currentRole === 'admin' ? 'teacher' : 'student';
      const pointsAdd = heartType === 'teacher' ? 20 : 10;
      const icon = btnElem ? btnElem.querySelector('i') : null;
      const span = btnElem ? btnElem.querySelector('span') : null;
      const ptsSpan = btnElem && btnElem.parentElement ? btnElem.parentElement.querySelector('.pts-val') : null;
      const snapshot = btnElem ? {
        liked: btnElem.classList.contains('liked'),
        iconClass: icon ? icon.className : '',
        hearts: span ? span.textContent : '',
        points: ptsSpan ? ptsSpan.textContent : ''
      } : null;

      heartRequestsInFlight.add(postId);
      if (btnElem) btnElem.disabled = true;

      // 서버 응답 전 즉각 반응하되, 실패하면 snapshot으로 정확히 되돌립니다.
      if(btnElem && icon && span && ptsSpan) {
        const oldHearts = Number(span.textContent || 0);
        const oldPoints = Number(ptsSpan.textContent || 0);
        if(snapshot.liked) {
          btnElem.classList.remove('liked');
          icon.className = 'fa-regular fa-heart';
          if(heartType === 'student') span.textContent = Math.max(0, oldHearts - 1);
          ptsSpan.textContent = Math.max(0, oldPoints - pointsAdd);
        } else {
          btnElem.classList.add('liked');
          icon.className = 'fa-solid fa-heart';
          if(heartType === 'student') span.textContent = oldHearts + 1;
          ptsSpan.textContent = oldPoints + pointsAdd;
        }
      }

      const finish = () => {
        heartRequestsInFlight.delete(postId);
        if (btnElem) btnElem.disabled = false;
        flushDeferredAutoRefresh();
      };
      const rollback = () => {
        if (!snapshot || !btnElem) return;
        btnElem.classList.toggle('liked', snapshot.liked);
        if (icon) icon.className = snapshot.iconClass;
        if (span) span.textContent = snapshot.hearts;
        if (ptsSpan) ptsSpan.textContent = snapshot.points;
      };

      google.script.run
        .withSuccessHandler(res => {
          if(res && res.success) {
            const post = allPostsData.find(p => p.postId === postId);
            if(post) {
              post.points = Number(res.points || 0);
              post.hearts = Number(res.hearts || 0);
              post.teacherHeart = res.teacherHeart === true || res.teacherHeart === 'YES';
              if (heartType === 'student' && typeof res.liked === 'boolean') {
                const set = new Set(Array.isArray(post.likedUsers) ? post.likedUsers : []);
                if (res.liked) set.add(currentUser); else set.delete(currentUser);
                post.likedUsers = Array.from(set);
              }
            }
            if (btnElem && span && ptsSpan) {
              span.textContent = Number(res.hearts || 0);
              ptsSpan.textContent = Number(res.points || 0);
              if (heartType === 'student' && typeof res.liked === 'boolean') {
                btnElem.classList.toggle('liked', res.liked);
                if (icon) icon.className = res.liked ? 'fa-solid fa-heart' : 'fa-regular fa-heart';
              } else if (heartType === 'teacher') {
                const teacherLiked = res.teacherHeart === true || res.teacherHeart === 'YES';
                btnElem.classList.toggle('liked', teacherLiked);
                if (icon) icon.className = teacherLiked ? 'fa-solid fa-heart' : 'fa-regular fa-heart';
              }
            }
          } else {
            rollback();
            if (res && res.authRequired) handleAuthExpired(getErrorMessage(res, '로그인 세션이 만료되었습니다.'));
            else showOperationError(res, '하트 처리에 실패했습니다.');
            deferredAutoRefresh = true;
          }
          finish();
        })
        .withFailureHandler(err => {
          rollback();
          showOperationError(err, '하트 처리 중 통신 오류가 발생했습니다.');
          deferredAutoRefresh = true;
          finish();
        })
        .addHeart(postId, currentSessionToken, heartType);
    }

    function getRank(targetScore, scoresArray) { if (targetScore === 0) return "-"; let rank = 1; for (let i = 0; i < scoresArray.length; i++) { if (scoresArray[i] > targetScore) rank++; else break; } return rank; }

    function renderAdminTable(mode) {
      if(mode) adminSortState.currentMode = mode; else mode = adminSortState.currentMode;
      queuePageStateSave();
      const cont = document.getElementById('admin-table-container');
      const btns = [document.getElementById('btn-admin-rank'), document.getElementById('btn-admin-badges'), document.getElementById('btn-admin-posts'), document.getElementById('btn-admin-ops')];
      btns.forEach(b => { b.style.background = '#e2e8f0'; b.style.color = '#334155'; });

      let stats = {};
      allPostsData.forEach(item => {
        if(!item.name) return; 
        if(!stats[item.name]) stats[item.name] = { name: item.name, points: 0, posts: 0, badgeSet: new Set() };
        stats[item.name].points += Number(item.points || 0);
        stats[item.name].posts += 1;
        if (item.topic) stats[item.name].badgeSet.add(item.topic);
      });
      for(let name in userStatsData) {
        if(!stats[name]) stats[name] = { name: name, points: Number(userStatsData[name] || 0), posts: 0, badgeSet: new Set() };
        else stats[name].points = Number(userStatsData[name] || 0);
      }

      let arr = Object.values(stats);
      let scoresArray = arr.map(u => u.points).sort((a,b) => b-a);
      arr.forEach(u => {
        u.rank = getRank(u.points, scoresArray);
        u.growth = calculateGrowthState(Array.from(u.badgeSet));
        u.badgeCount = u.growth.totalBadges;
        u.overallLevel = u.growth.overallLevel;
      });
      if(adminSortState.column) arr.sort((a, b) => { let vA = a[adminSortState.column]; let vB = b[adminSortState.column]; return vA < vB ? (adminSortState.order === 'asc' ? -1 : 1) : (vA > vB ? (adminSortState.order === 'asc' ? 1 : -1) : 0); });

      currentAdminStats = arr;
      if(mode === 'rank') {
        btns[0].style.background = 'var(--primary-color)'; btns[0].style.color = 'white';
        let h = `<table><tr><th onclick="handleSort('name')">학생 이름 ${getSortIcon('name')}</th><th onclick="handleSort('rank')">순위 ${getSortIcon('rank')}</th><th onclick="handleSort('overallLevel')">히어로 레벨 ${getSortIcon('overallLevel')}</th><th>획득 뱃지</th><th>영역별 성장</th><th onclick="handleSort('posts')">게시물 수 ${getSortIcon('posts')}</th><th onclick="handleSort('points')">총 포인트 ${getSortIcon('points')}</th></tr>`;
        arr.forEach((u, idx) => {
          const cg = u.growth.categories || {};
